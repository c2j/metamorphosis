[workspace]
members = ["crates/core", "crates/rules", "crates/cli", "crates/qed", "crates/verieql", "crates/mcp-server", "tests/regress"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ogsql-parser = { git = "https://github.com/c2j/ogsql-parser", tag = "v0.8.31" }
